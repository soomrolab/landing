software:
  # Check these URLs before publishing — some repos may have moved.
  - name: "nanoCAS"
    url: "https://github.com/tayabsoomro"
    description: "event-driven framework for real-time detection during nanopore sequencing"
  - name: "MICAS"
    url: "https://github.com/coadunate/MICAS"
    description: "MinION classification and alerting system"
  - name: "genoassist"
    url: "https://github.com/genoassist/genoassist"
    description: "genome assembly and annotation framework that compares assemblies so you can pick the best one"
