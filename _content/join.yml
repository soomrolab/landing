# ── Work with us page ────────────────────────────────────────────
title: "Work with us"

intro:
  - >-
    The lab is part of a federal research centre, which affects the kinds of
    opportunities we can offer. We do not handle graduate admissions. You can
    still work with us through the [Research Affiliate Program](https://www.canada.ca/en/public-service-commission/jobs/services/recruitment/students/research-affiliate-program.html).

sections:
  - title: "Students"
    body: |
      We take undergraduate co-op students, summer students and honours project
      students, and co-supervise graduate students with university supervisors.
      Past projects have included pedigree visualisation, genomic selection
      pipelines and real-time nanopore analysis.

      The problems are a blend of mathematics, software engineering and genomics. You should have a background in either life sciences, computer science or mathematics, and be willing to work across the other two.

      What matters is not how much code you can write by hand. It is critical thinking, an engineering mindset, and accountability for a result. If you can define the problem cleanly and stay with it until something actually works for a breeder, that is the job.

  - title: "Breeders and research scientists"
    body: |
      If you have a data problem, such as a pipeline that only runs on one
      person’s laptop, a genotype file you cannot join to your field book, or
      an analysis you would rather run yourself, that is the core of the job,
      not a favour. Get in touch early, rather than after the data is
      collected. The design decisions that make analysis easier are usually
      made before anything is sequenced.

  - title: "Collaborations"
    body: |
      We work with groups across AAFC, universities and industry on population genomics and breeding data. If your problem sits somewhere between genomics, mathematics and software engineering, that is generally where we are most useful.

panel:
  title: "Getting in touch"
  body: |
    Email [tayab.soomro@agr.gc.ca](mailto:tayab.soomro@agr.gc.ca). For student
    enquiries, say what you want to work on and roughly when you are available.
    A CV is important for student applications because it helps us understand
    your background and potential.

    For project enquiries, one paragraph about the question and one about the
    available data are enough to get started.

