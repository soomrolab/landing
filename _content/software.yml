title: "Software"

intro:
  - >-
    These are tools the lab has released for public use. Anyone can install
    and run them.
  - >-
    We also maintain pipelines for breeding programs at Brandon that are not
    public. They stay inside the centre because they are connected to program
    data.

tools_heading: "Open tools"
tools:
  - name: "nanoCAS"
    tagline: "Real-time detection and decision making during nanopore sequencing"
    status: "Manuscript in preparation"
    body: |
      Nanopore sequencing produces reads as it goes, but most analysis
      still waits for the run to finish. nanoCAS treats the run as a
      stream: it watches reads arrive, classifies them against a target
      database, and raises a detection as soon as there is enough evidence.
      For a field diagnostic, that can mean an answer in minutes rather than
      at the end of a flow cell.

      It ships with a web interface so the person running the sample does
      not need a terminal.
    links:
      GitHub: "https://github.com/tayabsoomro/nanoCAS.git"

pipelines_heading: "Internal pipelines"
pipelines:
  - name: "Barley genomic selection"
    tagline: "Nextflow pipeline for genomic selection in barley"
    status: "In production at BRDC"
    body: |
      A genomic selection pipeline that any member of the barley breeding
      program can run with minimal training. The point of the design was
      that it should not require a bioinformatician to operate.

closing:
  - >-
    We are happy to work with you to develop pipelines and tools for your
    program. Please get in touch if you would like to collaborate.
