# ── Lead bio page ────────────────────────────────────────────────
title: "Tayab Soomro"
role: "Bioinformatics Data Scientist Lead"

intro:
  - "I lead bioinformatics at Agriculture and Agri-Food Canada's Brandon
     Research and Development Centre, where I split my time between
     supporting the breeding programs and building the tools I think they
     will need next."
  - "My route in was through computer science rather than biology, and
     that has shaped what I work on. Most of the problems I find
     interesting are not open biological questions — they are engineering
     problems standing between a breeder and an answer they could
     otherwise already have."
  - "Alongside the research I co-founded [PathoScan](https://pathoscan.com),
     which builds portable crop disease diagnostics for growers and
     agronomists. Same motivation, different route: a test result that
     arrives in thirty minutes changes a decision, and one that arrives in
     a week usually does not."

positions_heading: "Positions"
positions:
  - period: "2025 —"
    role: "Bioinformatics Data Scientist Lead"
    org: "Agriculture and Agri-Food Canada, Brandon RDC"
    body: |
      Principal investigator on independent bioinformatics projects in
      population genomics, trait discovery and diagnostics; bioinformatics
      support to the centre's breeding and research programs; supervision
      of students and interns.

  - period: "2024 – 2025"
    role: "Bioinformatics Consultant"
    org: "Agriculture and Agri-Food Canada"
    body: |
      GWAS in *Vicia faba* for rust resistance and heat tolerance;
      annotation of *Aphanomyces* genomes; integration of the Nanopore
      Mk1C for point-of-care detection of plant and animal pathogens.

  - period: "2023"
    role: "Senior Computational Biologist"
    org: "FoodImprover Inc."
    body: |
      Association mapping across ~1,000 apple accessions and 5,000+
      features, and a full-stack platform for exploring the results.

  - period: "2020 – 2023"
    role: "Computational Biologist"
    org: "NRGene Canada Inc."
    body: |
      Industry-grade Python tooling and AWS-based pipeline infrastructure
      for genomics at scale, in a 100+ person organisation.

  - period: "2022 —"
    role: "Bioinformatics Consultant"
    org: "University of Saskatchewan"
    body: |
      Workshops and training programs on Linux, HPC, Python and cloud
      computing for graduate students; HPC resource management.

  - period: "2017 – 2020"
    role: "Student Research Assistant, then Student Bioinformatician"
    org: "Links Lab, University of Saskatchewan &middot; AAFC"
    body: |
      Where the nanopore work started: MinION usability, real-time
      base-call visualisation, and the first version of what became
      MICAS and then nanoCAS.

