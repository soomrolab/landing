eyebrow: "Soomro Lab &middot; Brandon Research and Development Centre &middot; Agriculture and Agri-Food Canada"

lede: >
  Breeding programs are rarely limited by biology. They are limited by
  [the distance between the data they collect and the decisions they
  make]{.accent}.

intro:
  - "We are the bioinformatics group at Agriculture and Agri-Food Canada's
     Brandon Research and Development Centre. We support breeders and
     research scientists with genomics and computational biology, and we
     build the tools that shorten that distance: connected breeding data 
     and analysis pipelines that do not need a bioinformatician standing 
     beside them."

  - "Weather is getting less predictable faster than variety development 
     cycles can absorb, and the crops going into the ground now have to 
     survive conditions nobody bred them for. Breeding is how agriculture 
     adapts. Our job is to remove whatever is slowing it down."

  - "These bottlenecks (i.e., disconnected data, unclear marker–trait 
     relationships, analysis queued behind one person) recur across wheat, 
     barley, oat, canola and pulses, and therefore we build tools that travel
     across crop-types."

  - "The lab is led by [Tayab Soomro](about.qmd). Most of what we build is
     [released openly](software.qmd)."

